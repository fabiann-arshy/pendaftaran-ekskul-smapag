        const modal = document.getElementById("customModalAlert");
        const iconBox = document.getElementById("alertIconContainer");
        document.getElementById("alertTitle").textContent = title;
        document.getElementById("alertMessage").innerHTML = msg;

        if (type === "error") {

        modal.classList.remove("hidden");
        modal.classList.add("flex");

          !inputNama.contains(e.target) &&
          !autocompleteList.contains(e.target)
        ) {
          autocompleteList.classList.add("hidden");
        }
      });

      inputWa.addEventListener("input", (e) => {
        if (/[^0-9]/.test(e.target.value)) {
          showCustomAlert(
            "Nomor WhatsApp/Kontak hanya boleh berisi angka!",
            "error",
            "Format Input Salah",
          );
          e.target.value = e.target.value.replace(/[^0-9]/g, "");
        }
      });

      inputNisn.addEventListener("input", (e) => {
        if (/[^0-9]/.test(e.target.value)) {
          showCustomAlert(
            "NISN hanya boleh berisi angka!",
            "error",
            "Format Input Salah",
          );
          e.target.value = e.target.value.replace(/[^0-9]/g, "");
        }
      });

      btnToggleForm.addEventListener("click", toggleFormMode);

      function toggleFormMode() {
        modeTerdaftar = !modeTerdaftar;
        document.getElementById("ekskulForm").reset();
        inputKelas.setAttribute("required", "true");

        if (modeTerdaftar) {
          fieldNisn.classList.add("hidden");
          fieldGender.classList.add("hidden");
          toggleMsg.innerHTML =
            'Tidak terdaftar?, <button type="button" id="btnToggleForm" class="text-amber-600 font-semibold hover:underline">yuk daftar sekarang!</button>';
        } else {
          fieldNisn.classList.remove("hidden");
          fieldGender.classList.remove("hidden");
          toggleMsg.innerHTML =
            'Sudah terdaftar?, <button type="button" id="btnToggleForm" class="text-amber-600 font-semibold hover:underline">kembali ke pencarian nama</button>';
        }
        document
          .getElementById("btnToggleForm")
          .addEventListener("click", toggleFormMode);
      }

      let pendingSubmitData = null;

      document
        .getElementById("btnSubmit")
        .addEventListener("click", async () => {
          let valid = true;

          if (!modeTerdaftar) {
            if (!inputNisn.value || inputNisn.value.length !== 10) {
              showCustomAlert(
                "NISN wajib diisi dan harus tepat 10 digit angka!",
                "error",
                "NISN Tidak Valid",
              );
              inputNisn.classList.add("border-red-500");
              valid = false;
              return;
            } else {
              inputNisn.classList.remove("border-red-500");
            }

            if (!inputGender.value) {
              inputGender.classList.add("border-red-500");
              valid = false;
            } else {
              inputGender.classList.remove("border-red-500");
            }
          }

          if (!inputNama.value.trim()) {
            inputNama.classList.add("border-red-500");
            valid = false;
          } else {
            inputNama.classList.remove("border-red-500");
          }

          if (!inputKelas.value) {
            inputKelas.classList.add("border-red-500");
            valid = false;
          } else {
            inputKelas.classList.remove("border-red-500");
          }

          if (!inputWa.value.trim()) {
            inputWa.classList.add("border-red-500");
            valid = false;
          } else {
            inputWa.classList.remove("border-red-500");
          }

          if (!valid) {
            showCustomAlert(
              "Harap lengkapi semua isian wajib yang bergaris merah!",
              "error",
              "Data Belum Lengkap",
            );
            return;
          }

          // CEK NAMA DARI DATABASE SUPABASE UNTUK CEK DUPLIKASI
          const { data: existingSiswa } = await supabaseClient
            .from("pendaftar-ekskul-smapag")
            .select("nama")
            .ilike("nama", inputNama.value.trim());

          if (existingSiswa && existingSiswa.length > 0) {
            showCustomAlert(
              `Nama <strong>${inputNama.value.trim()}</strong> sudah terdaftar dalam sistem pendaftaran!<br><br>Setiap siswa hanya dapat mengisi formulir 1 kali.`,
              "error",
              "Sudah Terdaftar",
            );
            return;
          }

          let ekskuls = ["Pramuka"];
          document.querySelectorAll(".ekskul-slot").forEach((slot) => {
            const sel = slot.querySelector(".ekskul-select").value;
            const cus = slot.querySelector(".ekskul-custom").value;
            if (sel === "Lainnya" && cus) ekskuls.push(cus);
            else if (sel && sel !== "Lainnya") ekskuls.push(sel);
          });

          pendingSubmitData = {
            nisn: modeTerdaftar ? "-" : inputNisn.value,
            nama: inputNama.value,
            gender: modeTerdaftar ? "-" : inputGender.value,
            kelas: inputKelas.value,
            wa: inputWa.value,
            ekskul: ekskuls.join(", "),
          };

          document.getElementById("confirmDataSummary").innerHTML = `
        <p><strong>Nama:</strong> ${pendingSubmitData.nama}</p>
        ${!modeTerdaftar ? `<p><strong>NISN:</strong> ${pendingSubmitData.nisn}</p>` : ""}
        ${!modeTerdaftar ? `<p><strong>Jenis Kelamin:</strong> ${pendingSubmitData.gender}</p>` : ""}
        <p><strong>Kelas:</strong> ${pendingSubmitData.kelas}</p>
        <p><strong>WhatsApp:</strong> ${pendingSubmitData.wa}</p>
        <p><strong>Ekskul:</strong> ${pendingSubmitData.ekskul}</p>
      `;

          const confirmModal = document.getElementById("customModalConfirm");
          confirmModal.classList.remove("hidden");
          confirmModal.classList.add("flex");
        });

      document
        .getElementById("btnConfirmCancel")
        .addEventListener("click", () => {
          document.getElementById("customModalConfirm").classList.add("hidden");
          document
            .getElementById("customModalConfirm")
            .classList.remove("flex");
        });

      document
        .getElementById("btnConfirmOk")
        .addEventListener("click", async () => {
          document.getElementById("customModalConfirm").classList.add("hidden");
          document
            .getElementById("customModalConfirm")
            .classList.remove("flex");

          if (pendingSubmitData) {
            try {
              const { error } = await supabaseClient
                .from("pendaftar-ekskul-smapag")
                .insert([pendingSubmitData]);

              if (error) throw error;

              showCustomAlert(
                "Pendaftaran berhasil tersimpan!",
                "success",
                "Berhasil",
              );
              document.getElementById("ekskulForm").reset();
              inputKelas.setAttribute("required", "true");
              pendingSubmitData = null;
            } catch (err) {
              showCustomAlert(
                "Gagal menyimpan data ke database cloud!",
                "error",
                "Gagal",
              );
            }
          }
        });
    </script>
  </body>
</html>
